name: Prepare or publish Blitzio production

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after separate production publication approval
        type: boolean
        required: true
        default: false
      approved_sha:
        description: Full reviewed source SHA, required only when publishing
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate production target and publication approval
        env:
          PUBLISH: ${{ inputs.publish }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: node scripts/check-release-input.cjs
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
          run_install: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm build
      - name: Check production artifact
        run: node scripts/check-static-output.cjs
      - name: Upload artifact without publishing
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    if: ${{ inputs.publish == true && inputs.approved_sha == github.sha && github.repository == 'blitzio/blitzio-site' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require separately configured production custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/blitzio/blitzio-site/pages > "$RUNNER_TEMP/pages.json"
          node -e "const fs=require('node:fs'); const pages=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/pages.json','utf8')); if(pages.cname !== 'blitzio.com' || pages.build_type !== 'workflow') throw new Error('Production Pages domain is not ready.');"
      - name: Read Pages configuration without enabling a site
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Publish approved production artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
